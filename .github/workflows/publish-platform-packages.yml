name: Publish built platform packages
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful platform-preview build run ID
        required: true
        type: string
      release_tag:
        description: Existing draft platform release
        required: true
        type: string
      android_build_run:
        description: Optional separately verified Android build run (desktop-only rebuilds)
        required: false
        default: ''
        type: string
      mac_build_run:
        description: Optional separately verified Mac launcher packaging run
        required: false
        default: ''
        type: string
      target:
        description: Package set to publish
        type: choice
        options: [all, android]
        default: all
permissions:
  actions: read
  contents: write
jobs:
  upload:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: ${{ inputs.build_run }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      PACKAGE_TARGET: ${{ inputs.target }}
      ANDROID_BUILD_RUN: ${{ inputs.android_build_run }}
      MAC_BUILD_RUN: ${{ inputs.mac_build_run }}
    steps:
      - name: Wait for completed builds and upload their packages
        shell: bash
        run: |
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-ports-preview\.[0-9]+$ ]]
          for attempt in $(seq 1 60); do
            status=$(gh run view "$BUILD_RUN" --json status --jq .status)
            if [ "$status" = completed ]; then
              if [ -n "$MAC_BUILD_RUN" ]; then
                [[ "$MAC_BUILD_RUN" =~ ^[0-9]+$ ]]
                [ "$PACKAGE_TARGET" = all ]
                [ "$(gh run view "$BUILD_RUN" --json jobs --jq '.jobs[] | select(.name | contains("linux-x64")) | .conclusion')" = success ]
              else
                [ "$(gh run view "$BUILD_RUN" --json conclusion --jq .conclusion)" = success ]
              fi
              break
            fi
            [ "$attempt" -lt 60 ]
            sleep 30
          done
          gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft | grep -qx true
          if [ -n "$MAC_BUILD_RUN" ]; then
            for attempt in $(seq 1 60); do
              status=$(gh run view "$MAC_BUILD_RUN" --json status --jq .status)
              if [ "$status" = completed ]; then
                [ "$(gh run view "$MAC_BUILD_RUN" --json conclusion --jq .conclusion)" = success ]
                break
              fi
              [ "$attempt" -lt 60 ]
              sleep 30
            done
            gh run download "$BUILD_RUN" -D packages/linux -n EarthBound-Companion-linux-x64-preview
            gh run download "$MAC_BUILD_RUN" -D packages/mac -p 'EarthBound-Companion-osx-*-preview'
          else
            gh run download "$BUILD_RUN" -D packages -p 'EarthBound-Companion-*-preview'
          fi
          if [ -n "$ANDROID_BUILD_RUN" ]; then
            [[ "$ANDROID_BUILD_RUN" =~ ^[0-9]+$ ]]
            [ "$PACKAGE_TARGET" = all ]
            # Other jobs in that run may have failed; only its unchanged
            # Android package is reused after its own complete tests passed.
            [ "$(gh run view "$ANDROID_BUILD_RUN" --json jobs --jq '.jobs[] | select(.name == "android") | .conclusion')" = success ]
            gh run download "$ANDROID_BUILD_RUN" -D packages/android -n EarthBound-Companion-android-preview
          fi
          mapfile -d '' files < <(find packages -type f \( -name '*.tar.gz' -o -name '*.apk' \) -print0)
          if [ "$PACKAGE_TARGET" = android ]; then
            [ "${#files[@]}" -eq 2 ]
            for file in "${files[@]}"; do [[ "$file" = *.apk ]]; done
          else
            [ "${#files[@]}" -eq 5 ]
          fi
          python - "${files[@]}" <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys
          repo, tag = os.environ['GH_REPO'], os.environ['RELEASE_TAG']
          # Draft tags need not exist as Git refs yet; resolve the release ID.
          release_id = json.loads(subprocess.check_output(
              ['gh', 'release', 'view', tag, '--json', 'databaseId']))['databaseId']
          def assets():
              release = json.loads(subprocess.check_output(
                  ['gh', 'api', f'repos/{repo}/releases/{release_id}']))
              return {entry['name']: entry for entry in release['assets']}
          uploaded = assets()
          for name in sys.argv[1:]:
              path = pathlib.Path(name)
              digest = 'sha256:' + hashlib.sha256(path.read_bytes()).hexdigest()
              if path.name not in uploaded:
                  subprocess.run(['gh', 'release', 'upload', tag, str(path)], check=True)
                  uploaded = assets()
              # A resumed job reuses identical completed uploads. It must never
              # silently replace a different file with the same package name.
              asset = uploaded[path.name]
              if asset['size'] != path.stat().st_size or asset.get('digest') != digest:
                  raise SystemExit(f'Uploaded file differs: {path.name}')
              print(json.dumps(dict(name=path.name, size=asset['size'],
                                    digest=digest, serverDigestVerified=True)))
          PY
